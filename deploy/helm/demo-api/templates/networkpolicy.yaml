{{- if .Values.networkPolicy.enabled }}
{{- if .Values.networkPolicy.defaultDeny }}
# Default deny: selects every pod in the namespace and allows nothing, in or out.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "demo-api.fullname" . }}-default-deny
  labels:
    {{- include "demo-api.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
{{- end }}
# Explicit allow: ingress to the app port only. No egress is allowed; the app
# makes no outbound calls (not even DNS).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "demo-api.fullname" . }}-allow-http
  labels:
    {{- include "demo-api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "demo-api.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: http
          protocol: TCP
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
