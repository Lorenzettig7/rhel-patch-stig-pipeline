name: demo-api image

# Patching at the image layer: every build runs `microdnf update` in the
# Containerfile, gates on Trivy, records an SBOM, and (on main) pushes,
# signs and attests the image by digest.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write
  id-token: write # keyless cosign signing via GitHub OIDC

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-scan-sign:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # GHCR references must be lowercase; the owner (Lorenzettig7) is not.
      - name: Compute image reference
        id: ref
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "image=ghcr.io/${repo}/demo-api" >> "$GITHUB_OUTPUT"
          echo "tag=ghcr.io/${repo}/demo-api:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Tagged with the commit SHA only, never `latest`. Provenance/SBOM
      # attestations from buildx are off so the pushed image is a single
      # manifest whose digest is what cosign signs.
      - name: Build image
        env:
          IMAGE_TAG: ${{ steps.ref.outputs.tag }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          docker buildx build \
            --load \
            --provenance=false \
            --sbom=false \
            --file app/Containerfile \
            --tag "$IMAGE_TAG" \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg SOURCE_URL="$SOURCE_URL" \
            app

      - name: Trivy scan (SARIF report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.ref.outputs.tag }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.ref.outputs.tag }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.ref.outputs.tag }}
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload scan and SBOM artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-api-${{ github.sha }}-evidence
          path: |
            trivy-results.sarif
            sbom.spdx.json
            sbom.cyclonedx.json
          if-no-files-found: warn

      # The gate: fail the build on any fixable CRITICAL/HIGH finding.
      - name: Trivy gate (CRITICAL,HIGH, fixable)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.ref.outputs.tag }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: '1'
          skip-setup-trivy: true

      # ---- main only: publish, sign and attest by digest ----

      - name: Install cosign
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image and capture digest
        id: push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
          IMAGE_TAG: ${{ steps.ref.outputs.tag }}
        run: |
          docker push "$IMAGE_TAG" | tee push.log
          digest="$(grep -oE 'digest: sha256:[0-9a-f]{64}' push.log | tail -1 | cut -d' ' -f2)"
          if [ -z "$digest" ]; then
            echo "::error::could not determine pushed digest"; exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "ref=${IMAGE}@${digest}" >> "$GITHUB_OUTPUT"

      # Sign and attest the immutable digest, never the mutable tag.
      - name: Sign image (keyless)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_REF: ${{ steps.push.outputs.ref }}
        run: cosign sign --yes "$IMAGE_REF"

      - name: Attest SPDX SBOM
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_REF: ${{ steps.push.outputs.ref }}
        run: cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$IMAGE_REF"

      - name: Verify signature and attestation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_REF: ${{ steps.push.outputs.ref }}
          IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
        run: |
          # workflow_ref is "<owner>/<repo>/.github/workflows/image.yml@refs/heads/main"
          cosign verify "$IMAGE_REF" \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          cosign verify-attestation "$IMAGE_REF" --type spdxjson \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "Verified signature and SPDX attestation for $IMAGE_REF"

      - name: Summary
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_REF: ${{ steps.push.outputs.ref }}
        run: |
          {
            echo "### demo-api published"
            echo ""
            echo "- Image: \`$IMAGE_REF\`"
            echo "- Tag: \`${GITHUB_SHA}\`"
            echo "- Signed + SPDX SBOM attested (keyless, Sigstore)"
          } >> "$GITHUB_STEP_SUMMARY"
