plugin: amazon.aws.aws_ec2
regions:
  - us-east-1
filters:
  tag:Project: lm-demo
  instance-state-name: running
hostnames:
  - tag:Name
keyed_groups:
  - key: ec2_tags.PatchRing
    prefix: ring
    separator: "_"
  - key: ec2_tags.OS
    prefix: os
    separator: "_"
compose:
  ansible_host: public_ip_address
  ansible_user: "'ec2-user'"
