---
- name: Pre-patch checks
  ansible.builtin.import_tasks: precheck.yml

- name: Apply updates
  ansible.builtin.import_tasks: patch.yml

- name: Reboot if required
  ansible.builtin.import_tasks: reboot.yml

- name: Verify and report
  block:
    - name: Post-patch verification
      ansible.builtin.import_tasks: verify.yml
  always:
    - name: Write patch report
      ansible.builtin.import_tasks: report.yml
