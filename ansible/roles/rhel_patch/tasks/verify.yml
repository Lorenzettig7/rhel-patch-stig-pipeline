---
# Verification is split into two phases: collect every data point first, then
# evaluate all of them at the end. A failing assertion therefore leaves the
# report with a complete dataset rather than a half-filled one, which matters
# because report.yml runs from an `always` block precisely so that failures
# produce evidence.

# ---------------------------------------------------------------- collection

- name: Re-gather facts
  ansible.builtin.setup:

- name: Collect service state (post-patch)
  ansible.builtin.service_facts:

- name: Record service verification results
  ansible.builtin.set_fact:
    patch_service_results: >-
      {{ patch_service_results | default({}) | combine({
           item: {
             'before': (patch_services_before[item ~ '.service'] | default({})).get('state', 'not-found'),
             'after': (ansible_facts['services'][item ~ '.service'] | default({})).get('state', 'not-found')
           }
         }) }}
  loop: "{{ patch_services_to_verify }}"

# Right after a reboot the system can briefly report "starting", so retry.
# failed_when is false here deliberately: this task records state, it does not
# judge it. The judgement happens in the evaluation phase below.
- name: Check overall systemd state  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: systemctl is-system-running
  register: patch_system_state
  until: patch_system_state.stdout in ['running', 'degraded']
  retries: 12
  delay: 10
  failed_when: false
  changed_when: false
  check_mode: false

- name: List failed units  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: systemctl list-units --state=failed --no-legend --plain
  register: patch_failed_units
  changed_when: false
  check_mode: false
  when: patch_system_state.stdout != 'running'

# --last sorts by install time, newest first. package_facts can't order by
# version without an extra collection, so query rpm directly.
- name: Find newest installed kernel  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: rpm -q --last kernel
  register: patch_installed_kernels
  changed_when: false
  check_mode: false
  failed_when: false

- name: Record kernel state
  ansible.builtin.set_fact:
    patch_kernel_after: "{{ ansible_facts['kernel'] }}"
    patch_kernel_newest: >-
      {{ (patch_installed_kernels.stdout_lines | default([]) | first | default(''))
         .split() | first | default('unknown') | regex_replace('^kernel-', '') }}

# ---------------------------------------------------------------- warnings
# Debug tasks run before the assertions so their output is always emitted,
# even when a later assertion ends the play for this host.

- name: Warn on degraded system
  ansible.builtin.debug:
    msg: >-
      WARNING: systemd reports {{ patch_system_state.stdout }}.
      Failed units: {{ patch_failed_units.stdout_lines | default([]) | join(', ') | default('none', true) }}
  when: patch_system_state.stdout != 'running'

- name: Warn on stale kernel (reboots disabled)
  ansible.builtin.debug:
    msg: >-
      WARNING: running {{ patch_kernel_after }}, newest installed is
      {{ patch_kernel_newest }}; reboot pending
  when:
    - not (patch_reboot_enabled | bool)
    - patch_kernel_after != patch_kernel_newest

# ---------------------------------------------------------------- evaluation

- name: Assert required services are running
  ansible.builtin.assert:
    that:
      - patch_service_results[item]['after'] == 'running'
    fail_msg: "{{ item }} is {{ patch_service_results[item]['after'] }} after patching"
    quiet: true
  loop: "{{ patch_services_to_verify }}"

- name: Assert systemd reports running or degraded
  ansible.builtin.assert:
    that:
      - patch_system_state.stdout in ['running', 'degraded']
    fail_msg: >-
      systemctl is-system-running reported '{{ patch_system_state.stdout }}'
      after {{ 12 * 10 }}s
    quiet: true

# With reboots disabled a stale kernel is expected and only warned about above.
- name: Assert running kernel is the newest installed
  ansible.builtin.assert:
    that:
      - patch_kernel_after == patch_kernel_newest
    fail_msg: "Running kernel {{ patch_kernel_after }} but newest installed is {{ patch_kernel_newest }}"
    success_msg: "Running newest installed kernel {{ patch_kernel_after }}"
    quiet: true
  when: patch_reboot_enabled | bool
